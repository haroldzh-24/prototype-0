name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Tests use node:sqlite, which needs Node 22.13 or newer without a flag.
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Install scripts are not needed for unit tests or the type check.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # expo-env.d.ts is generated by `expo start` and gitignored; the type check needs its Expo type references.
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npm test
      - run: npm run typecheck
